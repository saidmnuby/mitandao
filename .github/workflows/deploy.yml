name: Deploy approved developer project

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Portal deployment record ID
        required: true
        type: string
      repository:
        description: Approved developer repository
        required: true
        type: string
      branch:
        description: Approved source branch
        required: true
        type: string
      target:
        description: Approved cPanel document root
        required: true
        type: string
      source_sha:
        description: Exact source commit to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate approved deployment details
        id: config
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          deployment_id = os.environ["DEPLOYMENT_ID"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          target = os.environ["TARGET"]
          source_sha = os.environ["SOURCE_SHA"]

          if deployment_id != "0" and not re.fullmatch(r"[1-9][0-9]*", deployment_id):
              raise SystemExit("deployment_id si halali")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("repository si halali")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", branch) or ".." in branch:
              raise SystemExit("branch si halali")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", source_sha):
              raise SystemExit("source_sha si commit SHA halali")
          if (not re.fullmatch(r"/home/elimutai/[A-Za-z0-9._/-]+", target)
                  or any(part in (".", "..") for part in target.split("/"))):
              raise SystemExit("Target path hairuhusiwi")

          owner, repo = repository.split("/", 1)
          output = Path(os.environ["GITHUB_OUTPUT"])
          output.write_text(
              f"owner={owner}\nrepo={repo}\ntarget={target}\n",
              encoding="utf-8",
          )
          PY

      - name: Create read-only token for the approved repository
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ELIMUTAIFA_LABS_CLIENT_ID }}
          private-key: ${{ secrets.ELIMUTAIFA_LABS_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}
          permission-contents: read

      - name: Download approved developer repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          persist-credentials: false

      - name: Prepare Laravel runtime folders
        if: hashFiles('source/artisan') != '' && hashFiles('source/composer.json') != ''
        working-directory: source
        run: |
          set -euo pipefail
          for directory in \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs \
            bootstrap/cache; do
            mkdir -p "$directory"
            touch "$directory/.deployment-placeholder"
          done

      - name: Install PHP dependencies
        if: hashFiles('source/composer.json') != ''
        working-directory: source
        run: |
          set -euo pipefail
          php --version
          composer --version
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend assets
        if: hashFiles('source/package.json') != ''
        working-directory: source
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            if [ -f package-lock.json ]; then
              npm ci --no-audit
            else
              npm install --no-audit --no-fund
            fi
            npm run build
          else
            echo "Hakuna build script kwenye package.json; hatua imerukwa."
          fi

      - name: Upload project files to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          TARGET_DIR: ${{ steps.config.outputs.target }}
        run: |
          python -m pip install requests
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          host = os.environ["CPANEL_HOST"]
          user = os.environ["CPANEL_USER"]
          api_token = os.environ["CPANEL_API_TOKEN"]
          source = Path("source").resolve()
          target = os.environ["TARGET_DIR"].rstrip("/")
          headers = {"Authorization": f"cpanel {user}:{api_token}"}

          excluded_dirs = {".git", ".github", "node_modules"}
          excluded_files = {".cpanel.yml", ".DS_Store", "Thumbs.db", ".gitignore", ".gitattributes", ".editorconfig"}
          excluded_docs = {"readme.md", "license", "license.md", "changelog.md", "contributing.md"}
          checked_dirs = set()
          uploaded = 0

          def skip(path):
              relative = path.relative_to(source)
              name = path.name.lower()
              return (
                  any(part in excluded_dirs for part in relative.parts)
                  or path.name in excluded_files
                  or name.startswith(".env")
                  or name in excluded_docs
              )

          def ensure_dir(remote_dir):
              if remote_dir in checked_dirs:
                  return
              checked_dirs.add(remote_dir)
              parent, name = remote_dir.rsplit("/", 1)
              response = requests.get(
                  f"https://{host}:2083/json-api/cpanel",
                  headers=headers,
                  params={
                      "cpanel_jsonapi_user": user,
                      "cpanel_jsonapi_apiversion": "2",
                      "cpanel_jsonapi_module": "Fileman",
                      "cpanel_jsonapi_func": "mkdir",
                      "path": parent or "/",
                      "name": name,
                      "permissions": "0755",
                  },
                  timeout=30,
              )
              response.raise_for_status()
              result = response.json()["cpanelresult"]["event"]["result"]
              if str(result) == "1":
                  print(f"Folder imetengenezwa: {remote_dir}")
              else:
                  print(f"Folder ipo tayari au cPanel haikuunda: {remote_dir}")

          for path in sorted(source.rglob("*")):
              if path.is_symlink():
                  print(f"Umerukwa (symlink): {path.relative_to(source)}")
                  continue
              if not path.is_file():
                  continue
              if skip(path):
                  print(f"Umerukwa: {path.relative_to(source)}")
                  continue

              relative = path.relative_to(source)
              remote_dir = target
              for part in relative.parts[:-1]:
                  remote_dir += "/" + part
                  ensure_dir(remote_dir)

              with path.open("rb") as file_handle:
                  response = requests.post(
                      f"https://{host}:2083/execute/Fileman/upload_files",
                      headers=headers,
                      data={"dir": remote_dir, "overwrite": "1"},
                      files={"file-1": (path.name, file_handle)},
                      timeout=120,
                  )
              response.raise_for_status()
              try:
                  result = response.json()
              except ValueError:
                  raise RuntimeError(f"Jibu la cPanel halikusomeka kwa {relative}: {response.text}")
              if result.get("status") != 1:
                  print(json.dumps(result, indent=2, ensure_ascii=False))
                  raise RuntimeError(f"Imeshindikana kupakia: {relative}")
              uploaded += 1
              print(f"Imepakiwa/kusasishwa: {relative}")

          print(f"Jumla iliyopakiwa au kusasishwa: {uploaded}")
          PY

      - name: Report deployment result to portal
        if: always() && inputs.deployment_id != '0'
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_STATUS: ${{ job.status }}
          CALLBACK_URL: ${{ vars.ELIMUTAIFA_LABS_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.ELIMUTAIFA_LABS_CALLBACK_SECRET }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY' > callback.json
          import json
          import os
          payload = {
              "deployment_id": int(os.environ["DEPLOYMENT_ID"]),
              "status": {
                  "success": "success",
                  "failure": "failure",
                  "cancelled": "cancelled",
              }.get(os.environ["DEPLOYMENT_STATUS"], "failure"),
              "source_sha": os.environ["SOURCE_SHA"],
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          timestamp="$(date +%s)"
          signature="sha256=$(printf '%s.%s' "$timestamp" "$(cat callback.json)" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
          curl --fail-with-body --silent --show-error \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Timestamp: $timestamp" \
            -H "X-Deployment-Signature: $signature" \
            --data-binary @callback.json
