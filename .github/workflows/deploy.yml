name: Deploy approved developer project

on:
  workflow_dispatch:
    inputs:
      project:
        description: Kitambulisho cha mradi kilicho kwenye deploy-projects.json
        required: true
        type: string
      source_sha:
        description: Commit ya developer repo
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download admin configuration
        uses: actions/checkout@v4
        with:
          path: admin

      - name: Read approved project settings
        id: config
        env:
          PROJECT: ${{ inputs.project }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          project = os.environ["PROJECT"]
          source_sha = os.environ["SOURCE_SHA"]

          if not re.fullmatch(r"[0-9a-fA-F]{40}", source_sha):
              raise SystemExit("source_sha si commit SHA halali")

          config_file = Path("admin/deploy-projects.json")
          projects = json.loads(config_file.read_text(encoding="utf-8"))

          if project not in projects:
              raise SystemExit(f"Mradi haujaidhinishwa: {project}")

          settings = projects[project]
          target = settings["target"]

          if not target.startswith("/home/elimutai/"):
              raise SystemExit("Target path hairuhusiwi")

          output = Path(os.environ["GITHUB_OUTPUT"])
          output.write_text(
              f"repository={settings['repository']}\n"
              f"branch={settings['branch']}\n"
              f"target={target}\n"
              f"token_name={settings['source_token']}\n",
              encoding="utf-8",
          )
          PY

      - name: Download approved developer repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets[steps.config.outputs.token_name] }}
          path: source

      - name: Upload project files to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          TARGET_DIR: ${{ steps.config.outputs.target }}
        run: |
          python -m pip install requests
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          host = os.environ["CPANEL_HOST"]
          user = os.environ["CPANEL_USER"]
          api_token = os.environ["CPANEL_API_TOKEN"]
          source = Path("source").resolve()
          target = os.environ["TARGET_DIR"].rstrip("/")
          headers = {"Authorization": f"cpanel {user}:{api_token}"}

          excluded_dirs = {".git", ".github", "node_modules"}
          excluded_files = {
              ".cpanel.yml",
              ".DS_Store",
              "Thumbs.db",
              ".gitignore",
              ".gitattributes",
              ".editorconfig",
          }
          excluded_docs = {
              "readme.md",
              "license",
              "license.md",
              "changelog.md",
              "contributing.md",
          }

          checked_dirs = set()
          uploaded = 0

          def skip(path):
              relative = path.relative_to(source)
              name = path.name.lower()
              return (
                  any(part in excluded_dirs for part in relative.parts)
                  or path.name in excluded_files
                  or name.startswith(".env")
                  or name in excluded_docs
              )

          def ensure_dir(remote_dir):
              if remote_dir in checked_dirs:
                  return
              checked_dirs.add(remote_dir)

              parent, name = remote_dir.rsplit("/", 1)
              response = requests.get(
                  f"https://{host}:2083/json-api/cpanel",
                  headers=headers,
                  params={
                      "cpanel_jsonapi_user": user,
                      "cpanel_jsonapi_apiversion": "2",
                      "cpanel_jsonapi_module": "Fileman",
                      "cpanel_jsonapi_func": "mkdir",
                      "path": parent or "/",
                      "name": name,
                      "permissions": "0755",
                  },
                  timeout=30,
              )
              response.raise_for_status()
              result = response.json()["cpanelresult"]["event"]["result"]
              if str(result) == "1":
                  print(f"Folder imetengenezwa: {remote_dir}")
              else:
                  print(f"Folder ipo tayari au cPanel haikuunda: {remote_dir}")

          for path in sorted(source.rglob("*")):
              if not path.is_file():
                  continue
              if skip(path):
                  print(f"Umerukwa: {path.relative_to(source)}")
                  continue

              relative = path.relative_to(source)
              remote_dir = target
              for part in relative.parts[:-1]:
                  remote_dir += "/" + part
                  ensure_dir(remote_dir)

              with path.open("rb") as file_handle:
                  response = requests.post(
                      f"https://{host}:2083/execute/Fileman/upload_files",
                      headers=headers,
                      data={"dir": remote_dir, "overwrite": "1"},
                      files={"file-1": (path.name, file_handle)},
                      timeout=120,
                  )

              response.raise_for_status()

              try:
                  result = response.json()
              except ValueError:
                  raise RuntimeError(
                      f"Jibu la cPanel halikusomeka kwa {relative}: {response.text}"
                  )

              if result.get("status") != 1:
                  print(json.dumps(result, indent=2, ensure_ascii=False))
                  raise RuntimeError(f"Imeshindikana kupakia: {relative}")

              uploaded += 1
              print(f"Imepakiwa/kusasishwa: {relative}")

          print(f"Jumla iliyopakiwa au kusasishwa: {uploaded}")
          PY
