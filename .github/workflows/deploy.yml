name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pata mafaili ya repository
        uses: actions/checkout@v6

      - name: Vuta kutoka GitHub na deploy
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          auth="Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}"
          repo="/home/elimutai/repositories/mitandao"

          pull_response="$(curl --fail --silent --show-error --get \
            --header "$auth" \
            --data-urlencode "name=mitandao" \
            --data-urlencode "repository_root=$repo" \
            --data-urlencode "branch=main" \
            --data-urlencode 'source_repository={"remote_name":"origin"}' \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update")"

          echo "$pull_response" | jq .
          echo "$pull_response" | jq -e '.status == 1' >/dev/null

          deploy_response="$(curl --fail --silent --show-error --get \
            --header "$auth" \
            --data-urlencode "repository_root=$repo" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create")"

          echo "$deploy_response" | jq .
          echo "$deploy_response" | jq -e '.status == 1' >/dev/null
