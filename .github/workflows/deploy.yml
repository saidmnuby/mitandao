name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pata mafaili ya repository
        uses: actions/checkout@v6

      - name: Deploy kupitia FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: hm105.radns.net
          username: mitandao@mitandao.elimutaifa.co.tz
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
